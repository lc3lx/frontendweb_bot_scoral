<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <script>
      (function () {
        try {
          var locale = localStorage.getItem('scar-alpha-web-locale');
          var dir = locale === 'en' ? 'ltr' : 'rtl';
          var lang = locale === 'en' ? 'en' : 'ar';
          document.documentElement.lang = lang;
          document.documentElement.dir = dir;
          function applyBody() {
            if (!document.body) return;
            document.body.lang = lang;
            document.body.dir = dir;
          }
          if (document.body) applyBody();
          else document.addEventListener('DOMContentLoaded', applyBody);
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#020101" />
    <meta
      name="description"
      content="Scar Alpha AI — منصة تداول ثنائي ذكية مؤتمتة"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>Scar Alpha AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
